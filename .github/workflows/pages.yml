# 계획서 §8: "매 Phase 종료 시 배포 — GitHub Pages 에 올려 실제 브라우저에서 플레이"
#
# 최초 1회는 저장소 Settings → Pages → Build and deployment → Source 를
# "GitHub Actions" 로 수동 지정해야 한다. 그러지 않으면 아래 configure-pages
# 단계가 "Get Pages site failed" 로 실패한다. 한 번 지정해 두면 그다음부터는
# main 에 푸시할 때마다 이 워크플로가 알아서 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: 빌드 (저장소 이름을 base 경로로)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
