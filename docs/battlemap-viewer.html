  '~':['#7FA0A8','하천'], '=':['#A9C0C4','여울'],
  's':['#B9C3BC','바다'], 'M':['#A5A183','늪'],   'W':['#5A5143','성벽'],
  'G':['#A83232','성문'], 'P':['#8C7C5E','항구'], 'r':['#C6B48C','길'],
  // §7.1 — 치·옹성벽은 성벽 계열이라 짙게, 해자는 물빛
  'T':['#3F382E','치(雉)'], 'O':['#7A6A55','옹성벽'], 'D':['#7E9099','해자']
};
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const $=i=>document.getElementById(i);
const ids=Object.keys(DATA.maps);
$('sel').innerHTML=ids.map(i=>{
  const m=DATA.maps[i];
  const tag=[m.hasSea?'해':'',m.hasRiver?'강':''].filter(Boolean).join('·');
  return `<option value="${i}">${m.name}　${({capital:'도성',major:'대성',fort:'산성',port:'항구'})[m.type]}${tag?'　'+tag:''}</option>`;
}).join('');

function render(id){
  const m=DATA.maps[id];
  const tw=cv.width/m.w, th=cv.height/m.h;
  const cnt={};
  for(let y=0;y<m.h;y++){
    for(let x=0;x<m.w;x++){
      const ch=m.tiles[y][x];
      cnt[ch]=(cnt[ch]||0)+1;
      cx.fillStyle=(C[ch]||['#CFC09C'])[0];
      cx.fillRect(x*tw,y*th,tw+0.6,th+0.6);
    }
  }
  // 격자
  cx.strokeStyle='rgba(36,31,26,.07)'; cx.lineWidth=1;
  for(let x=0;x<=m.w;x+=4){cx.beginPath();cx.moveTo(x*tw,0);cx.lineTo(x*tw,cv.height);cx.stroke();}
  for(let y=0;y<=m.h;y+=4){cx.beginPath();cx.moveTo(0,y*th);cx.lineTo(cv.width,y*th);cx.stroke();}
  // 진입 방향 화살
  cx.font='700 15px "Noto Serif KR",serif'; cx.textAlign='center'; cx.textBaseline='middle';
  const seen={};
  m.approaches.forEach(a=>{
    if(seen[a.edge])return; seen[a.edge]=1;
    const p={N:[cv.width/2,18],S:[cv.width/2,cv.height-18],
             W:[18,cv.height/2],E:[cv.width-18,cv.height/2]}[a.edge];
    cx.fillStyle=a.sea?'#4E7480':'#241F1A';
    cx.fillText({N:'▲',S:'▼',W:'◀',E:'▶'}[a.edge],p[0],p[1]);
  });

  $('mSize').textContent=`${m.kmW}×${m.kmH}km`;
  $('mMtn').textContent=m.mountainous.toFixed(2);
  $('mRidge').textContent=`${m.ridgeKm}km`;
  const tot=m.w*m.h;
  // §7 성곽 요약 — 유형·이중성벽·쌍성·계곡수
  const FORM={sanseong:'산성',pyeongsanseong:'평산성',eupseong:'읍성',port:'항구',twin:'쌍성',none:'성 없음'};
  const tags=[FORM[m.form]||m.form];
  if(m.doubleWall) tags.push('이중성벽');
  if(m.twinCastle) tags.push('쌍성');
  if(m.waterSource) tags.push('계곡수');
  tags.push('성문 '+m.gates, '치 '+m.chi, '옹성 '+m.ongseong, '해자 '+m.moat);
  $('legend').innerHTML='<b style="letter-spacing:.1em">'+tags.join(' · ')+'</b><br>'+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([ch,n])=>`<div class="lg"><span style="background:${(C[ch]||['#CFC09C'])[0]}"></span>
      ${(C[ch]||['','기타'])[1]} <em style="font-family:'JetBrains Mono';font-style:normal;
      font-size:10px;color:var(--meok-cap);margin-left:auto">${Math.round(n/tot*100)}%</em></div>`).join('');
  const by={};
  m.approaches.forEach(a=>{
    (by[a.edge]=by[a.edge]||[]).push(
      (DATA.maps[a.from]?DATA.maps[a.from].name:a.from)+(a.sea?'(수로)':''));
  });
  $('appr').innerHTML=Object.keys(by).length
    ? Object.entries(by).map(([e,v])=>`${({N:'북',S:'남',W:'서',E:'동'})[e]} — ${v.join(', ')}`).join('<br>')
    : '연결 없음';
}
$('sel').onchange=e=>render(e.target.value);
render(ids[0]);
